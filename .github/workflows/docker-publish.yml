name: Build & Push ke Docker Hub

on:
  push:
    branches: [ "main" ] # Action jalan setiap kali ada push ke branch main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Ambil kode dari repository ini
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Login ke Docker Hub (Menggunakan Secret yang baru Anda buat)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Image dan Push ke Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Ganti ini sesuai nama repo docker hub Anda: achmadroyhan/practice_dockerfile
          tags: achmadroyhan/practice_dockerfile:latest